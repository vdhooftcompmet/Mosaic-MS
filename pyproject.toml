[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-ms"
version = "0.1.0"
description = "CLI tool and pipeline for mass spectrometry network analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "numpy",
    "matchms",
    "tomotopy",
    "ms2deepscore",
    "spec2vec",
    "gensim",
    "joblib",
    "tqdm",
    "scipy",
    "pyyaml"
]

[project.scripts]
mosaic-ms = "cli:main"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_site_packages = true

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "matchms.*",
    "tomotopy.*",
    "ms2deepscore.*",
    "spec2vec.*",
    "ndex2.*",
    "joblib.*",
    "gensim.*"
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = "."