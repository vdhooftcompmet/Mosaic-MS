name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Ensures shell commands run inside the activated conda environment
    defaults:
      run:
        shell: bash -el {0}

    steps:
      # Step 1: Check out repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Miniconda and environment from YAML
      - name: Set up Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.10' # Optional: can also be specified inside your environment.yaml
          environment-file: environment.yaml # Change to environment.yml if that's your filename
          use-mamba: true # Uses mamba for much faster environment resolution

      # Step 3: Install your package in editable mode if necessary
      - name: Install package
        run: |
          pip install -e .

      # Step 4: Run pytest
      - name: Run pytest
        run: |
          pytest
