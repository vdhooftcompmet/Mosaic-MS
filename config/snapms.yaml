ppm_error: 10
min_cluster_size: 0
max_cluster_size: 200
min_annotation_size: 3
cutoff: 0.66
threshold: 0.01

adduct_list:
    - "[M+H]+"
    - "[M+Na]+"
    - "[2M+Na]+"
    - "[M+K]+"
    - "[2M+K]+"

remove_duplicates: True
detect_adduct: True

reference-db: data/coconut_db.jsonl
result_folder: results/snapms
graph: results/motif_graph.cx
